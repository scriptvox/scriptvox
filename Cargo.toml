# Two members: the CLI, and the Rust voice with its own dependencies.
[workspace]
members = ["crates/scriptvox", "crates/scriptvox-kokoro"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/scriptvox/scriptvox"

[profile.dev]
debug = 0

# The local voice is a neural network in pure Rust. With no optimisation it needed 329 s for 18 s of speech
# (measured 13 Nov 2026, 12 cores), and every test and trial that uses the dev build paid that. These crates are the
# inference path; the rest of the dev build stays fast to compile.
[profile.dev.package.scriptvox-kokoro]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.gemm-c32]
opt-level = 3
[profile.dev.package.gemm-c64]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.dyn-stack]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.safetensors]
opt-level = 3

# One static, stripped binary for releases.
[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Rows on the self-hosted gateway name an example host. Add your service to generators.toml in the config folder: a row with the same name replaces this one (docs/specs/self-hosted.md).
# Generative rows (phase 2, P2-001): data, checked by Rust (src/generators.rs).
# Price units: `usd_per_s` per second of output, and on a speech to text row per second of the audio sent; `usd_each` per
# picture on an image row. `unverified`: never run against the real service; `providers` and `plan` say so.
# Every price comes from the provider's own page, with the link and the day it was read. `price = "exact"` means the
# page states this per-second price for this model; `"base"` means a per-second price is stated but the page does not
# say whether resolution or duration changes it, so plans show it as an estimate.
# Other price shapes, only when the provider page states them: `usd_min` (smallest charge of a call), `usd_per_input_s` (per
# second of the source sent), `usd_per_reference` (per reference picture), `usd_per_s_sound` (with `generate_audio = true`).
# `durations`: only values a provider page states. `duration_string`: the model takes "5", not 5.
# `extra`: fixed inputs sent with every request. `commercial`: false until the model licence is checked.

[[generator]]
name = "kling-2.6-pro"
gateway = "fal"
kind = "video.gen"
key = "fal"
t2v = "fal-ai/kling-video/v2.6/pro/text-to-video"
i2v = "fal-ai/kling-video/v2.6/pro/image-to-video"
# The endpoint's own schema, read 9 Nov 2026: `start_image_url` is required and `image_url` does not exist.
image_field = "start_image_url"
durations = [5, 10]
aspects = ["16:9", "9:16", "1:1"]
usd_per_s = 0.07
price = "exact"
price_source = "https://fal.ai/pricing"
price_checked = "2026-11-02"
output = "video.url"
hosts = ["fal.media"]
duration_string = true
# Kling makes audio by default; scriptvox adds its own voice, and audio may change the price.
extra = { generate_audio = false }
terms = { attribution_required = false, redistribution = false, note = "Kling through fal. Not confirmed for business use: the fal page says commercial use via fal. Kling's own terms (https://kling.ai/docs/user-policy, updated 21 Apr 2026) ask for written permission for commercial use, so read both before business use. Read 9 Nov 2026." }

[[generator]]

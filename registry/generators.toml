terms = { attribution_required = false, redistribution = false, note = "MiniMax H3 through fal. Output may run up to 0.7 s longer than asked (fal page). Not confirmed for business use: the fal page tags it for commercial use, and the page of MiniMax's own terms (https://platform.minimax.io/protocol/terms-of-service) gave no text to read. Read 9 Nov 2026." }


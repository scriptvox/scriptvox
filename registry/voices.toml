# Open voices on your own GPU service (services/gen, audio image): Chatterbox Multilingual speaks, Whisper large-v3 times the words.
# Free, MIT. Needs `scriptvox keys set selfhost` and your service's CA (see the selfhost generator rows). Clone only with consent.
[[voice]]
engine = "selfhost"
id = "chatterbox-ar"
lang = "ar"
gender = "built-in (one voice; clone a consented sample for others)"
network = true
cost = "free"
timing = "aligned"
terms = "Chatterbox Multilingual (MIT) on self-hosted GPUs, watermarked output; word times from Whisper"
key = "SCRIPTVOX_SELFHOST_KEY"
commercial = true

[[voice]]
